# =============================================================================
# Docker Compose — Test Environment Overlay
# =============================================================================
#
# Usage (explicit -f to bypass the dev override):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up
#
# Or via env-file shortcut (COMPOSE_FILE is set in .env.test):
#   docker compose --env-file .env.test up
#
# This overlay:
#   - Runs backend with NODE_ENV=test and an ephemeral tmpfs database
#   - Exposes the backend on host for test runner access
#   - Tightens health check intervals for faster startup
#   - Does NOT start the frontend (test-only backend)
#

services:

  # ---------- Backend: test overrides ----------
  backend:
    environment:
      NODE_ENV: test
      LOG_LEVEL: ${TEST_LOG_LEVEL:-warn}
      DATABASE_URL: /tmp/test-todos.db
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-8080}
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    # Ephemeral database — destroyed when the container stops
    volumes: !override []
    tmpfs:
      - /tmp:size=64M
    # Faster health feedback for CI
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Allow debugging in test env
    read_only: false
    security_opt: []

  # ---------- Frontend: disabled in test mode ----------
  frontend:
    profiles:
      - test-with-frontend    # effectively disabled unless explicitly requested


