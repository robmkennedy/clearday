    <line x1="90" y1="48" x2="90" y2="27"/>
    <line x1="121" y1="59" x2="136" y2="44"/>
    <line x1="132" y1="90" x2="153" y2="90"/>
    <line x1="121" y1="121" x2="136" y2="136"/>
    <line x1="90" y1="132" x2="90" y2="153"/>
    <line x1="59" y1="121" x2="44" y2="136"/>
    <line x1="48" y1="90" x2="27" y2="90"/>
    <line x1="59" y1="59" x2="44" y2="44"/>
  </g>
</svg>
