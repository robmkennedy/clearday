<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple, reliable todo application" />
    <title>BMad Todo</title>
    <!-- Theme flash prevention - must run before CSS loads -->
    <script>
      (function() {
        var saved = localStorage.getItem('bmad-todo-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Only use saved value if it's valid ('light' or 'dark')
        var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
