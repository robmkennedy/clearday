# =============================================================================
# Nginx Configuration — ClearDay Frontend
# SPA routing | API reverse proxy | Gzip | Security headers | Non-root (8080)
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security Headers ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------- Gzip Compression ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---------- Container Health Check ----------
    # Lightweight endpoint for Docker/K8s probes — no SPA overhead, no log noise
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # ---------- API Reverse Proxy ----------
    # Forward /api requests to the backend service
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ---------- Static Asset Caching ----------
    # Vite hashed assets — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA Fallback ----------
    # All non-file routes fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Block Dotfiles ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

